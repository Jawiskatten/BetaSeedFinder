name: Bug report
description: Report a reproducible application, backend, or packaging problem
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I read the troubleshooting guide.
          required: true
  - type: input
    attributes:
      label: Version
      placeholder: v0.5.0-alpha.1
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Backend
      options: [AMD HIP, NVIDIA CUDA, CPU/Java only, Unknown]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Windows version, GPU, driver, Java version, and relevant toolkit version.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior and logs
      description: Remove personal paths and unrelated result data.
    validations:
      required: true
