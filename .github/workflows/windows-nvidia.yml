name: Build NVIDIA worker

on:
  workflow_dispatch:
  push:
    paths:
      - "native/**"
      - "scripts/build-native.ps1"
      - "scripts/verify.ps1"
      - "VERSION.txt"
      - ".github/workflows/windows-nvidia.yml"

permissions:
  contents: read

jobs:
  build-nvidia:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify clean repository source
        shell: pwsh
        run: ./scripts/verify.ps1 -ProjectRoot "$env:GITHUB_WORKSPACE" -Strict

      - name: Install CUDA Toolkit 12.8.1
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Verify CUDA development headers
        shell: pwsh
        run: |
          $header = Join-Path $env:CUDA_PATH 'include\cuda_runtime.h'
          if (-not (Test-Path $header -PathType Leaf)) {
            throw "CUDA runtime header was not installed: $header"
          }
          Write-Host "CUDA runtime header: $header"

      - name: Build NVIDIA worker
        shell: pwsh
        run: ./scripts/build-native.ps1 -ProjectRoot "$env:GITHUB_WORKSPACE" -Backend NVIDIA

      - name: Upload internal NVIDIA worker
        uses: actions/upload-artifact@v7
        with:
          name: BetaSeedFinder-NVIDIA-Worker
          if-no-files-found: error
          retention-days: 30
          path: |
            build/native/nvidia/BetaSeedFinderWorker.exe
            build/native/nvidia/build.log
