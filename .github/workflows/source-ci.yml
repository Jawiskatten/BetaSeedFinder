name: Source verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify curated source tree
        shell: pwsh
        run: ./scripts/Verify-GithubSource.ps1 -ProjectRoot "$env:GITHUB_WORKSPACE" -Strict

      - name: Compile Java sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $sources = Get-ChildItem src -Recurse -Filter *.java | ForEach-Object { $_.FullName }
          if (-not $sources) { throw "No Java sources found." }

          & javac -encoding UTF-8 -d bin @sources
          if ($LASTEXITCODE -ne 0) {
            throw "javac failed with exit code $LASTEXITCODE"
          }

          Write-Host "Compiled $($sources.Count) Java source files."
